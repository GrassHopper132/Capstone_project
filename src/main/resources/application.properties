spring.application.name=Capstone_project
# 1. Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/museum_manager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA & Hibernate Configuration
# 'update' modifies the schema based on your Entity classes.
# Once your schema is stable, change this to 'validate' or 'none'.
spring.jpa.hibernate.ddl-auto=update

# Shows the actual SQL queries Hibernate is generating in your console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Server Configuration
server.port=8080
