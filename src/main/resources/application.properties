spring.application.name=Capstone_project

# ---- Datasource ----
spring.datasource.url=jdbc:mysql://localhost:3306/museum_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
# validate, not update: database/schema.sql is the source of truth.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Pagination ----
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100


# ---- Server ----
server.port=8080
server.error.include-message=always

# ---- Security ----
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
app.jwt.expiry-minutes=30

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
